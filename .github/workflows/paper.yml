name: paper
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: writeup
          root_file: main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: main.pdf
          path: writeup/main.pdf
