name: paper
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: writeup
          root_file: main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: main.pdf
          path: writeup/main.pdf
      - name: Publish PDF to hub
        if: github.ref == 'refs/heads/main'
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_EMAIL: ${{ secrets.HUB_EMAIL }}
          HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
        run: hub/scripts/publish.sh paper writeup/main.pdf main.pdf
